<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="flex justify-center items-center flex-col p-4 bg-slate-500 gap-2">
    <div class="bg-white w-full max-w-lg rounded-md shadow-lg">
        <h1 class="text-3xl font-bold text-center mb-5">My Todo app</h1>

        <form id="todo-form" class="flex flex-col p-2 gap-2">
            <input type="text" id="todo-input" placeholder="Enter new task..." class="border rounded-md p-3">
            <span id="error-message" class="bg-red-300 text-sm mt-2"></span>
            <button type="submit" class="bg-emerald-400 p-2 rounded-lg cursor-pointer">Add</button>
        </form>

    </div>
    <div class="bg-white w-full max-w-lg rounded-md shadow-lg">
        <p class="text-2xl font-bold text-center mb-5">Pending</p>
        <ul id="pending-list" class="mt-2 flex flex-col gap-2 p-2"></ul>
    </div>

    <div class="bg-white w-full max-w-lg rounded-md shadow-lg">
        <p class="text-2xl font-bold text-center mb-5">Completed</p>
        <ul id="completed-list" class="mt-2 flex flex-col gap-2 p-2"></ul>
    </div>
    <script src="./todo.js"></script>
</body>

</html>
