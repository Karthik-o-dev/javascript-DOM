<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>open</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div id="recipe-model" class="fixed inset-0 z-[2000] bg-black/10 backdrop-blur-md  items-center justify-center p-4">
        <div id="recipe-modal-content" class="relative bg-white w-full max-w-4xl overflow-y-auto rounded-3xl">
            <button id="close-recipe-modal"
                class="absolute top-2 right-4 w-10 h-10 rounded-full bg-white text-gray-400 hover:bg-gray-100 cursor-pointer">&times;</button>

            <div class="w-full flex">
                <div>
                    <img id="modal-recipe-image" src="" alt="" class="w-full h-full object-cover">
                </div>
                <div class="w-full">
                    <p id="modal-recipe-cuisine" class="text-sm text-[#FF6B21] font-semibold mb-2">
                    </p>

                    <h2 id="modal-recipe-name" class="text-2xl md:text-3xl font-bold text-[#003B20] mb-3">
                    </h2>

                    <div class="flex flex-wrap gap-4 text-sm text-gray-600 mb-5">
                        <span id="modal-recipe-rating"></span>
                        <span id="modal-recipe-time"></span>
                        <span id="modal-recipe-servings"></span>
                    </div>

                    <p id="modal-recipe-price" class="text-xl font-bold text-[#003B20] mb-6">
                    </p>
                </div>
            </div>

            <div class="mb-6">
                <h3 class="text-lg font-bold text-[#003B20] mb-3">
                    Ingredients
                </h3>
                <ul id="modal-recipe-ingredients" class="list-disc pl-5 space-y-2 text-sm text-gray-600">
                </ul>
            </div>

            <div class="mb-6">
                <h3 class="text-lg font-bold text-[#003B20] mb-3">
                    Instructions
                </h3>
                <ol id="modal-recipe-instructions" class="list-decimal pl-5 space-y-2 text-sm text-gray-600">
                </ol>
            </div>

            <div class="flex items-center gap-4 mb-5">
                <span class="font-semibold text-gray-700">Quantity</span>

                <div class="flex items-center gap-3 border rounded-full px-3 py-1">
                    <button id="modal-quantity-minus" type="button" class="px-2 text-lg font-bold cursor-pointer">
                        −
                    </button>

                    <span id="modal-quantity" class="font-semibold">1</span>

                    <button id="modal-quantity-plus" type="button" class="px-2 text-lg font-bold cursor-pointer">
                        +
                    </button>
                </div>
            </div>

            <button id="modal-add-to-cart" type="button"
                class="w-full bg-[#FF6B21] hover:bg-[#e85d18] text-white font-semibold py-3 rounded-full cursor-pointer transition">
                Add to Cart
            </button>
        </div>
    </div>

    <script src="./menu.js"></script>
</body>

</html>
